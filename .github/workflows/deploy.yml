name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Свой домен подключается одним файлом: создайте public/CNAME
      # с одной строкой вида `example.ru` — дальше всё настроится само.
      - name: Определить адрес сайта
        id: addr
        run: |
          REPO='${{ github.event.repository.name }}'
          OWNER='${{ github.repository_owner }}'
          if [ -f public/CNAME ]; then
            # Свой домен — сайт лежит в корне
            DOMAIN=$(tr -d '[:space:]' < public/CNAME)
            echo "site=https://$DOMAIN" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "Свой домен: $DOMAIN"
          elif [ "$REPO" = "$OWNER.github.io" ]; then
            # Главный сайт пользователя — тоже в корне, без префикса
            echo "site=https://$REPO" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "Главный сайт: https://$REPO"
          else
            # Обычный репозиторий — сайт лежит в подпапке с его именем
            echo "site=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/$REPO/" >> "$GITHUB_OUTPUT"
            echo "Проектная страница: https://$OWNER.github.io/$REPO/"
          fi

      - name: Сборка сайта
        run: npm run build
        env:
          SITE_URL: ${{ steps.addr.outputs.site }}
          BASE_PATH: ${{ steps.addr.outputs.base }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
