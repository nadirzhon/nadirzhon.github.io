name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Свой домен подключается одним файлом: создайте public/CNAME
      # с одной строкой вида `example.ru` — дальше всё настроится само.
      - name: Определить адрес сайта
        id: addr
        run: |
          if [ -f public/CNAME ]; then
            DOMAIN=$(tr -d '[:space:]' < public/CNAME)
            echo "site=https://$DOMAIN" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "Свой домен: $DOMAIN"
          else
            echo "site=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
            echo "Адрес GitHub Pages по умолчанию"
          fi

      - name: Сборка сайта
        run: npm run build
        env:
          SITE_URL: ${{ steps.addr.outputs.site }}
          BASE_PATH: ${{ steps.addr.outputs.base }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
